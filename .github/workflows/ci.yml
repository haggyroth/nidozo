name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Python: lint (ruff) + tests (pytest)  — run in parallel
  # -----------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Run ruff via uvx (no venv needed)
        run: uvx ruff@0.11.13 check src/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Create venv and install project + dev deps
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run mypy --strict
        run: uv run mypy src/ --strict

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Create venv and install project + dev deps
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: uv run pytest --tb=short --cov=src/nidozo --cov-fail-under=65

  # -----------------------------------------------------------------------
  # Frontend: build check
  # -----------------------------------------------------------------------
  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # -----------------------------------------------------------------------
  # Docker: build BOTH images and verify the stack actually runs.
  # `docker build` alone only proves the Dockerfiles parse — the real failure
  # modes (missing dist/, missing data/, missing config.js, bad networking)
  # only surface at runtime, so we bring the stack up and poll /healthz, which
  # returns 200 only when the API can reach both its DB and the Showdown server.
  # No registry push.
  # -----------------------------------------------------------------------
  docker-smoke:
    name: Docker build + run (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build images
        run: docker compose build

      # Real path: api depends_on showdown (service_healthy), so this also
      # validates startup ordering. If a container crashes the step fails, but
      # the always() log-dump step below still captures why.
      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the stack to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5001/healthz; then
              echo
              echo "Stack healthy — API reached its DB and the Showdown server."
              exit 0
            fi
            echo "Attempt $i: not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "::error::Stack did not become healthy within 5 minutes"
          exit 1

      - name: Dump container status and logs (always)
        if: always()
        run: |
          echo "===== docker compose ps ====="
          docker compose ps
          echo "===== showdown logs ====="
          docker compose logs showdown
          echo "===== api logs ====="
          docker compose logs api

      - name: Tear down
        if: always()
        run: docker compose down -v
