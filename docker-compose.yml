# Nidozo — production stack for utopiaplanitia (or any Docker host)
# Usage: docker compose up -d
#
# Services:
#   showdown  — Pokémon Showdown battle engine (Node)
#   api       — FastAPI backend + React SPA (Python)
#
# SQLite data persists on the nidozo-data named volume across restarts.
# To reset the database: docker compose down -v

services:
  showdown:
    build:
      context: showdown
      dockerfile: Dockerfile
    restart: unless-stopped
    # Port exposed for direct Showdown access (debugging / cockpit view).
    # Host side is 8001 (not 8000) to avoid colliding with other services on
    # shared hosts — the api container talks to Showdown over the internal
    # Docker network (NIDOZO_SHOWDOWN_HOST=showdown), not this published port.
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      showdown:
        condition: service_healthy
    environment:
      # Route poke-env and the WS proxy to the showdown service
      NIDOZO_SHOWDOWN_HOST: showdown
      NIDOZO_SHOWDOWN_PORT: "8000"
      # SQLite path inside the named volume
      NIDOZO_DB: /data/nidozo.db
      # Shared-secret auth (#212). Set NIDOZO_API_TOKEN in the host env (or a
      # .env file next to this compose file) to require it on every /api/* call
      # and WebSocket. The API now FAILS CLOSED: if the token is unset it
      # refuses to start unless NIDOZO_ALLOW_INSECURE=1 is set (see below).
      # Leave it open ONLY when the host is not reachable beyond localhost —
      # the API spends real LLM credits.
      NIDOZO_API_TOKEN: ${NIDOZO_API_TOKEN:-}
      # Explicit opt-out of the fail-closed auth guard. Set to 1 only for a
      # loopback-only / air-gapped instance; otherwise always set the token above.
      NIDOZO_ALLOW_INSECURE: ${NIDOZO_ALLOW_INSECURE:-0}
      # Optional rate limit (requests/min per IP) on the battle-start endpoints.
      # Left unset it defaults to 60/min once NIDOZO_API_TOKEN is set; 0 keeps an
      # exposed instance unlimited on purpose.
      NIDOZO_RATE_LIMIT_PER_MIN: ${NIDOZO_RATE_LIMIT_PER_MIN:-}
      # Addresses of reverse proxies in front of this container (IPs/CIDRs).
      # Required for per-client limiting behind a proxy: without it the client
      # key is the proxy's own address, so every client shares one allowance
      # and one of them can exhaust it for everyone. Unset = X-Forwarded-For is
      # ignored, which is the safe default when the api port is directly exposed.
      NIDOZO_TRUSTED_PROXIES: ${NIDOZO_TRUSTED_PROXIES:-}
      # LLM backends. Point LM_STUDIO_BASE_URL at the machine running LM Studio
      # (e.g. http://enterprise-e:1234/v1). Cloud keys are passed through from
      # the host env when present.
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://localhost:1234/v1}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-local-model}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - nidozo-data:/data

volumes:
  nidozo-data:
    driver: local
