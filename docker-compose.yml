# Nidozo — production stack for utopiaplanitia (or any Docker host)
# Usage: docker compose up -d
#
# Services:
#   showdown  — Pokémon Showdown battle engine (Node)
#   api       — FastAPI backend + React SPA (Python)
#
# SQLite data persists on the nidozo-data named volume across restarts.
# To reset the database: docker compose down -v

services:
  showdown:
    build:
      context: showdown
      dockerfile: Dockerfile
    restart: unless-stopped
    # Port exposed for direct Showdown access (debugging / cockpit view)
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      showdown:
        condition: service_healthy
    environment:
      # Route poke-env and the WS proxy to the showdown service
      NIDOZO_SHOWDOWN_HOST: showdown
      NIDOZO_SHOWDOWN_PORT: "8000"
      # SQLite path inside the named volume
      NIDOZO_DB: /data/nidozo.db
      # Shared-secret auth (#212). Set NIDOZO_API_TOKEN in the host env (or a
      # .env file next to this compose file) to require it on every /api/* call
      # and WebSocket. Leave unset ONLY when the host is not reachable beyond
      # localhost — the API spends real LLM credits.
      NIDOZO_API_TOKEN: ${NIDOZO_API_TOKEN:-}
      # LLM backends. Point LM_STUDIO_BASE_URL at the machine running LM Studio
      # (e.g. http://enterprise-e:1234/v1). Cloud keys are passed through from
      # the host env when present.
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://localhost:1234/v1}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-local-model}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - nidozo-data:/data

volumes:
  nidozo-data:
    driver: local
