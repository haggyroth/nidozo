[project]
name = "nidozo"
version = "0.46.0"
description = "LLM vs LLM Pokémon battle arena powered by Pokémon Showdown and poke-env"
requires-python = ">=3.12"
dependencies = [
    "poke-env>=0.8.0",
    "anthropic>=0.113.0",
    "openai>=2.44.0",
    "jinja2>=3.1.0",
    "fastapi>=0.138.2",
    "uvicorn[standard]>=0.50.2",
    "httpx>=0.27",          # imported by api/routes.py — runtime, not just tests
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1",
    "httpx2>=2.5.0",        # silences the starlette TestClient deprecation warning
    "ruff==0.16.3",        # linting — CI installs and runs this exact version
    "mypy>=2.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a live Showdown server on localhost:8000 (deselected by default)",
]

[tool.mypy]
strict = true
ignore_missing_imports = true   # poke_env, anthropic, openai stubs not always present

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long — handled by formatter if needed
    "B008",  # do not perform function calls in argument defaults (FastAPI uses this)
    "UP007", # X | Y union syntax — keep Optional[] for clarity
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # assert is fine in tests

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Aliases the [project.optional-dependencies] dev extra above rather than
# repeating it. Keeping a second, hand-maintained list here is what let the two
# drift apart: `uv run`/`uv sync` activate this group by default, so a tool
# missing from it (ruff, pytest) got uninstalled out from under `uv run`.
[dependency-groups]
dev = ["nidozo[dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/nidozo"]
